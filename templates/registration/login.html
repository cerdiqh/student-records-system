{% extends "auth_base.html" %}{% load ui %}
{% block body %}
{% for e in form.non_field_errors %}
  <div class="alert alert-danger py-2 small">{{ e }}</div>
{% endfor %}
<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label" for="id_username">Username or matric number</label>
    {{ form.username|bs }}
  </div>
  <div class="mb-3">
    <label class="form-label" for="id_password">Password</label>
    {{ form.password|bs }}
  </div>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-primary w-100" style="background: var(--sars-navy); border-color: var(--sars-navy)">Sign in</button>
</form>
<div class="text-center mt-3 small"><a href="{% url 'password_reset' %}">Forgot your password?</a></div>
{% endblock %}
