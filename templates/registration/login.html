{% load static ui %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Student Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<div class="login-wrap px-3">
  <div class="card login-card shadow">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-mortarboard-fill fs-1" style="color: var(--sars-navy)"></i>
        <h1 class="h5 mt-2 mb-0">Student Academic Records</h1>
        <div class="text-muted small">{{ INSTITUTION_NAME }}<br>{{ DEPARTMENT_NAME }}</div>
      </div>
      {% if form.non_field_errors %}
        <div class="alert alert-danger py-2 small">Invalid username/matric number or password.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="id_username">Username or matric number</label>
          {{ form.username|bs }}
        </div>
        <div class="mb-3">
          <label class="form-label" for="id_password">Password</label>
          {{ form.password|bs }}
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100" style="background: var(--sars-navy); border-color: var(--sars-navy)">Sign in</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
