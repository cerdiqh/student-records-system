{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">{{ title }}</h1>
  {% if back %}<a href="{% url back %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a>{% endif %}
</div>
<div class="card">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {% include "includes/fields.html" %}
      <div class="mt-4">
        <button class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
        {% if back %}<a href="{% url back %}" class="btn btn-link">Cancel</a>{% endif %}
      </div>
    </form>
  </div>
</div>
{% endblock %}
